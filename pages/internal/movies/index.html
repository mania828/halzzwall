<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HALZZWALL — Movies</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/imports.css" />
    <link rel="stylesheet" type="text/css" href="/assets/css/vars.css" />
    <link rel="stylesheet" type="text/css" href="/assets/css/pages/internalBase.css" />
    <link rel="icon" type="icon/x-icon" href="/assets/imgs/logo.png" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000;
        color: #fff;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Top bar ── */
      .movies-topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: rgba(10,10,10,0.95);
        border-bottom: 1px solid rgba(155,0,255,0.25);
        flex-shrink: 0;
        z-index: 10;
      }

      .movies-wordmark {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.5px;
        white-space: nowrap;
        user-select: none;
      }
      .movies-wordmark .w1 { color: #fff; }
      .movies-wordmark .w2 { color: rgb(155,0,255); }

      .movies-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: rgba(155,0,255,0.8);
        padding: 3px 8px;
        border: 1px solid rgba(155,0,255,0.35);
        border-radius: 3px;
      }

      /* search bar in topbar */
      .movies-search-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(20,20,20,0.9);
        border: 1px solid rgba(155,0,255,0.25);
        border-radius: 6px;
        padding: 6px 12px;
        max-width: 600px;
        margin: 0 auto;
      }
      .movies-search-wrap input {
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 13px;
        width: 100%;
      }
      .movies-search-wrap input::placeholder { color: rgba(255,255,255,0.3); }
      .movies-search-wrap svg { flex-shrink: 0; opacity: 0.5; }

      .movies-source-btn {
        background: rgba(155,0,255,0.12);
        border: 1px solid rgba(155,0,255,0.35);
        color: rgba(255,255,255,0.7);
        padding: 6px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .movies-source-btn:hover,
      .movies-source-btn.active {
        background: rgba(155,0,255,0.3);
        color: #fff;
        border-color: rgba(155,0,255,0.7);
      }

      /* ── Proxy frame ── */
      .movies-frame-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      .movies-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* ── Loading overlay ── */
      .frame-loader {
        position: absolute;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 5;
        transition: opacity 0.4s;
      }
      .frame-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-wordmark {
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .loader-wordmark .w1 { color: #fff; }
      .loader-wordmark .w2 { color: rgb(155,0,255); }

      .loader-sub {
        font-size: 13px;
        color: rgba(255,255,255,0.4);
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .loader-spin {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(155,0,255,0.2);
        border-top-color: rgb(155,0,255);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* source picker chips */
      .source-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 8px;
      }
      .source-chip {
        padding: 8px 18px;
        border-radius: 20px;
        border: 1px solid rgba(155,0,255,0.35);
        background: rgba(155,0,255,0.1);
        color: rgba(255,255,255,0.7);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .source-chip:hover {
        background: rgba(155,0,255,0.3);
        color: #fff;
        border-color: rgb(155,0,255);
        box-shadow: 0 0 14px rgba(155,0,255,0.3);
      }
    </style>
  </head>
  <body>

    <!-- Top bar -->
    <div class="movies-topbar">
      <div class="movies-wordmark"><span class="w1">halzz</span><span class="w2">wall</span></div>
      <div class="movies-label">MOVIES</div>

      <div class="movies-search-wrap">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <path fill="#fff" d="M7.132 0C3.197 0 0 3.124 0 6.97c0 3.844 3.197 6.969 7.132 6.969 1.557 0 2.995-.49 4.169-1.32L16.82 18 18 16.847l-5.454-5.342a6.846 6.846 0 0 0 1.718-4.536C14.264 3.124 11.067 0 7.132 0zm0 .82c3.48 0 6.293 2.748 6.293 6.15 0 3.4-2.813 6.149-6.293 6.149S.839 10.37.839 6.969C.839 3.568 3.651.82 7.132.82z"/>
        </svg>
        <input id="movieSearch" type="text" placeholder="Search movies, shows, anime..." autocomplete="off" />
      </div>

      <button class="movies-source-btn active" id="btnMovy" onclick="loadSource('movy')">Movy.sx</button>
      <button class="movies-source-btn" id="btnEmbed" onclick="loadSource('embed')">Embed.su</button>
      <button class="movies-source-btn" id="btnVidsrc" onclick="loadSource('vidsrc')">VidSrc</button>
    </div>

    <!-- Frame -->
    <div class="movies-frame-wrap">
      <div class="frame-loader" id="frameLoader">
        <div class="loader-wordmark"><span class="w1">halzz</span><span class="w2">wall</span></div>
        <div class="loader-sub">Loading Stream</div>
        <div class="loader-spin"></div>
        <div class="source-chips">
          <div class="source-chip" onclick="loadSource('movy')">🎬 Movy.sx</div>
          <div class="source-chip" onclick="loadSource('embed')">📺 Embed.su</div>
          <div class="source-chip" onclick="loadSource('vidsrc')">🔥 VidSrc</div>
        </div>
      </div>
      <iframe
        id="moviesFrame"
        class="movies-frame"
        src=""
        allowfullscreen
        allow="autoplay; fullscreen; encrypted-media"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
      ></iframe>
    </div>

    <!--Libs-->
    <script src="/assets/js/lib/localforage/localforage.min.js"></script>
    <script src="/assets/js/lib/wisp-client-js/wisp-client.js"></script>
    <script src="/assets/js/lib/Nightmare/nightmare.js"></script>
    <!--APIs-->
    <script src="/assets/js/apis/events.js"></script>
    <script src="/assets/js/apis/logging.js"></script>
    <script src="/assets/js/apis/settings.js"></script>
    <!--Proxy-->
    <script src="/baremux/index.js"></script>
    <script src="/@/uv.bundle.js"></script>
    <script src="/@/uv.config.js"></script>
    <script src="/$/scramjet.config.js"></script>
    <script src="/$/scramjet.all.js"></script>
    <script src="/!/meteor.codecs.js"></script>
    <script src="/!/meteor.config.js"></script>
    <script src="/!/meteor.bundle.js"></script>
    <script src="/e/eclipse.codecs.js"></script>
    <script src="/e/eclipse.config.js"></script>
    <script src="/&/sandstone.js"></script>
    <!--Main-->
    <script src="/assets/js/apis/proxy.js"></script>
    <script src="/assets/js/global/theming.js"></script>
    <script src="/assets/js/global/index.js"></script>

    <script>
      const SOURCES = {
        movy:   'https://www.movy.sx/',
        embed:  'https://embed.su/',
        vidsrc: 'https://vidsrc.to/',
      };

      let currentSource = 'movy';

      function loadSource(key) {
        currentSource = key;
        // highlight buttons
        document.querySelectorAll('.movies-source-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn' + key.charAt(0).toUpperCase() + key.slice(1));
        if (btn) btn.classList.add('active');

        const loader = document.getElementById('frameLoader');
        loader.classList.remove('hidden');

        const frame = document.getElementById('moviesFrame');
        frame.src = '';

        // Use proxy if available, else direct
        const url = SOURCES[key];
        setTimeout(() => {
          try {
            if (window.__hzwProxy) {
              frame.src = window.__hzwProxy(url);
            } else if (window.__uv$config) {
              frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            } else {
              frame.src = url;
            }
          } catch(e) {
            frame.src = url;
          }

          frame.onload = () => {
            setTimeout(() => loader.classList.add('hidden'), 600);
          };
        }, 200);
      }

      // Search handler — route searches through proxy
      document.getElementById('movieSearch').addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        const q = this.value.trim();
        if (!q) return;

        const searchUrls = {
          movy:   `https://www.movy.sx/search?q=${encodeURIComponent(q)}`,
          embed:  `https://embed.su/search/${encodeURIComponent(q)}`,
          vidsrc: `https://vidsrc.to/search?q=${encodeURIComponent(q)}`,
        };

        const loader = document.getElementById('frameLoader');
        loader.classList.remove('hidden');
        const frame = document.getElementById('moviesFrame');
        frame.src = '';

        const url = searchUrls[currentSource];
        setTimeout(() => {
          try {
            if (window.__hzwProxy) {
              frame.src = window.__hzwProxy(url);
            } else if (window.__uv$config) {
              frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            } else {
              frame.src = url;
            }
          } catch(e) {
            frame.src = url;
          }
          frame.onload = () => {
            setTimeout(() => loader.classList.add('hidden'), 600);
          };
        }, 200);
      });

      // Load default source on page load
      window.addEventListener('load', () => {
        loadSource('movy');
      });
    </script>
  </body>
</html>
