  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body {
      background:#000;color:#fff;
      font-family:'Inter','Segoe UI',sans-serif;
      height:100vh;display:flex;flex-direction:column;overflow:hidden;
    }

    /* ── TOP BAR ── */
    .shows-topbar {
      display:flex;align-items:center;gap:12px;
      padding:10px 16px;
      background:rgba(10,10,10,0.97);
      border-bottom:1px solid rgba(155,0,255,0.25);
      flex-shrink:0;
    }
    .wordmark{font-size:18px;font-weight:900;letter-spacing:-.5px;user-select:none}
    .wordmark .w1{color:#fff} .wordmark .w2{color:rgb(155,0,255)}
    .shows-badge{
      font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;
      color:rgba(155,0,255,.8);padding:3px 8px;
      border:1px solid rgba(155,0,255,.35);border-radius:3px;
    }
    .search-wrap{
      flex:1;display:flex;align-items:center;gap:8px;
      background:rgba(20,20,20,.9);border:1px solid rgba(155,0,255,.25);
      border-radius:6px;padding:6px 12px;max-width:480px;margin:0 auto;
    }
    .search-wrap input{background:transparent;border:none;outline:none;color:#fff;font-size:13px;width:100%}
    .search-wrap input::placeholder{color:rgba(255,255,255,.3)}

    /* ── MAIN LAYOUT ── */
    .shows-body{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden}

    /* ── SIDEBAR ── */
    .sidebar{
      background:rgba(8,8,8,.98);border-right:1px solid rgba(155,0,255,.18);
      overflow-y:auto;display:flex;flex-direction:column;
    }
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-track{background:transparent}
    .sidebar::-webkit-scrollbar-thumb{background:rgba(155,0,255,.3);border-radius:2px}

    .show-card{
      display:flex;align-items:center;gap:10px;padding:14px 16px;
      cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);
      transition:all .15s;position:relative;
    }
    .show-card:hover{background:rgba(155,0,255,.1)}
    .show-card.active{background:rgba(155,0,255,.18);border-right:3px solid rgb(155,0,255)}
    .show-emoji{font-size:22px;flex-shrink:0}
    .show-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
    .show-eps{font-size:11px;color:rgba(155,0,255,.7);margin-top:2px}

    /* ── CONTENT AREA ── */
    .content-area{display:flex;flex-direction:column;overflow:hidden}

    /* Player */
    .player-section{
      flex-shrink:0;position:relative;
      background:#000;
    }
    iframe#ep-player{
      width:100%;height:320px;border:none;display:none;
    }
    .player-placeholder{
      width:100%;height:320px;display:flex;align-items:center;
      justify-content:center;flex-direction:column;gap:8px;
      background:linear-gradient(180deg,rgba(10,0,20,0.95) 0%,#000 100%);
      border-bottom:1px solid rgba(155,0,255,.15);
    }
    .player-placeholder-icon{font-size:40px;opacity:.3}
    .player-placeholder-txt{font-size:13px;color:rgba(255,255,255,.25);letter-spacing:1px}
    .player-info{
      padding:10px 16px;background:rgba(10,0,20,.9);
      border-bottom:1px solid rgba(155,0,255,.12);display:none;
    }
    .player-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgb(155,0,255)}
    .player-title{font-size:15px;font-weight:700;margin-top:3px}
    .player-meta{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}

    /* Season + Episode list */
    .episodes-section{flex:1;overflow-y:auto;padding:12px}
    .episodes-section::-webkit-scrollbar{width:4px}
    .episodes-section::-webkit-scrollbar-thumb{background:rgba(155,0,255,.25);border-radius:2px}

    .season-header{
      display:flex;align-items:center;gap:10px;
      padding:10px 0 8px;margin-top:8px;
      border-bottom:1px solid rgba(155,0,255,.15);
      cursor:pointer;user-select:none;
    }
    .season-header:first-child{margin-top:0}
    .season-arrow{
      font-size:10px;color:rgba(155,0,255,.7);
      transition:transform .2s;flex-shrink:0;
    }
    .season-header.collapsed .season-arrow{transform:rotate(-90deg)}
    .season-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.7)}
    .season-count{font-size:11px;color:rgba(155,0,255,.6);margin-left:auto;flex-shrink:0}

    .season-eps{overflow:hidden;transition:max-height .25s ease}
    .season-eps.collapsed{max-height:0!important}

    .ep-item{
      display:grid;grid-template-columns:42px 1fr 60px;
      align-items:center;gap:10px;
      padding:8px 8px;margin:2px 0;border-radius:6px;
      cursor:pointer;transition:background .15s;
    }
    .ep-item:hover{background:rgba(155,0,255,.1)}
    .ep-item.playing{background:rgba(155,0,255,.2);border:1px solid rgba(155,0,255,.4)}
    .ep-num{
      font-size:11px;font-weight:700;color:rgba(155,0,255,.6);
      text-align:center;font-variant-numeric:tabular-nums;
    }
    .ep-title{font-size:12px;color:rgba(255,255,255,.8);line-height:1.3}
    .ep-badge{
      font-size:10px;font-weight:700;text-align:right;
      color:rgba(155,0,255,.5);
    }
    .ep-item.playing .ep-badge{color:rgb(155,0,255)}

    /* ZIP download item */
    .zip-item{
      display:flex;align-items:center;gap:12px;
      padding:12px 10px;margin:4px 0;border-radius:6px;
      background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);
      cursor:pointer;transition:all .2s;
    }
    .zip-item:hover{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}
    .zip-icon{font-size:20px;flex-shrink:0}
    .zip-label{font-size:12px;color:rgba(245,158,11,.9);font-weight:600}
    .zip-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
    .zip-btn{
      margin-left:auto;flex-shrink:0;
      background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);
      color:rgb(245,158,11);padding:5px 12px;border-radius:4px;
      font-size:11px;font-weight:700;cursor:pointer;
    }

    /* Empty state */
    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;gap:12px;color:rgba(255,255,255,.2);
    }
    .empty-icon{font-size:48px;opacity:.3}
    .empty-txt{font-size:13px;letter-spacing:1px}
  </style>

  /* ── HELPERS ── */
  function cleanTitle(raw) {
    return raw
      .replace(/\.(mp4|mkv|avi|mov)$/i,'')
      .replace(/South\.Park\.\w+\d+\w+\d+\./i,'')
      .replace(/South Park S\d+E\d+ /i,'')
      .replace(/^S\d+E\d+ /i,'')
      .replace(/\./g,' ')
      .trim();
  }
  function epCode(raw, idx) {
    const m = raw.match(/[Ss](\d+)[Ee](\d+)/);
    if (m) return 'S'+m[1].padStart(2,'0')+'E'+m[2].padStart(2,'0');
    return 'EP'+(idx+1).toString().padStart(2,'0');
  }

  /* ── STATE ── */
  let activeShowId = null;
  let currentEp = null;

  /* ── BUILD SIDEBAR ── */
  const sidebar = document.getElementById('sidebar');
  SHOWS.forEach(show => {
    const total = show.seasons.reduce((a,s)=>a+(s.zip?1:s.episodes.length),0);
    const card = document.createElement('div');
    card.className = 'show-card';
    card.dataset.id = show.id;
    card.innerHTML = `
      <div class="show-emoji">${show.emoji}</div>
      <div>
        <div class="show-name">${show.name}</div>
        <div class="show-eps">${show.seasons.length} seasons</div>
      </div>`;
    card.addEventListener('click', ()=>loadShow(show.id));
    sidebar.appendChild(card);
  });

  /* ── LOAD SHOW ── */
  function loadShow(id) {
    activeShowId = id;
    document.querySelectorAll('.show-card').forEach(c=>{
      c.classList.toggle('active', c.dataset.id === id);
    });
    const show = SHOWS.find(s=>s.id===id);
    if (!show) return;
    renderEpisodes(show);
  }

  /* ── RENDER EPISODE LIST ── */
  function renderEpisodes(show, filter='') {
    const sec = document.getElementById('episodes-section');
    sec.innerHTML = '';
    filter = filter.toLowerCase();

    show.seasons.forEach((season, si) => {
      const hdr = document.createElement('div');
      hdr.className = 'season-header';
      hdr.innerHTML = `
        <span class="season-arrow">▼</span>
        <span class="season-label">${season.label}</span>
        <span class="season-count">${season.zip ? '📦' : season.episodes.length + ' eps'}</span>`;

      const epsWrap = document.createElement('div');
      epsWrap.className = 'season-eps';

      if (season.zip) {
        const zipEl = document.createElement('div');
        zipEl.className = 'zip-item';
        zipEl.innerHTML = `
          <div class="zip-icon">📦</div>
          <div>
            <div class="zip-label">ZIP Download Available</div>
            <div class="zip-sub">Open Google Drive folder to download</div>
          </div>
          <button class="zip-btn" onclick="window.open('https://drive.google.com/drive/folders/${season.fid}','_blank')">↓ Drive</button>`;
        epsWrap.appendChild(zipEl);
      } else {
        season.episodes.forEach((ep, idx) => {
          const title = cleanTitle(ep.raw);
          const code  = epCode(ep.raw, idx);
          if (filter && !title.toLowerCase().includes(filter) && !code.toLowerCase().includes(filter)) return;

          const item = document.createElement('div');
          item.className = 'ep-item';
          item.dataset.gdid = ep.gdid;
          item.innerHTML = `
            <div class="ep-num">${code}</div>
            <div class="ep-title">${title}</div>
            <div class="ep-badge">▶</div>`;
          item.addEventListener('click', ()=>playEp(ep, show.name, item, idx));
          epsWrap.appendChild(item);
        });
      }

      // collapse logic
      let collapsed = false;
      hdr.addEventListener('click', ()=>{
        collapsed = !collapsed;
        hdr.classList.toggle('collapsed', collapsed);
        if (collapsed) {
          epsWrap.style.maxHeight = '0';
        } else {
          epsWrap.style.maxHeight = epsWrap.scrollHeight + 'px';
        }
      });
      // set initial maxHeight after render
      requestAnimationFrame(()=>{
        epsWrap.style.maxHeight = epsWrap.scrollHeight + 'px';
      });

      sec.appendChild(hdr);
      sec.appendChild(epsWrap);
    });
  }

  /* ── PLAY EPISODE ── */
  function playEp(ep, showName, itemEl, idx) {
    document.querySelectorAll('.ep-item').forEach(i=>i.classList.remove('playing'));
    itemEl.classList.add('playing');
    currentEp = ep;

    const frame = document.getElementById('ep-player');
    const ph    = document.getElementById('player-placeholder');
    const info  = document.getElementById('player-info');

    frame.src = `https://drive.google.com/file/d/${ep.gdid}/preview`;
    frame.style.display = 'block';
    ph.style.display    = 'none';
    info.style.display  = 'block';

    const code  = epCode(ep.raw, idx||0);
    const title = cleanTitle(ep.raw);
    document.getElementById('player-label').textContent = code + ' — ' + showName;
    document.getElementById('player-title').textContent = title;
    document.getElementById('player-meta').textContent  = 'Streaming via Google Drive';
  }

  /* ── SEARCH ── */
  document.getElementById('epSearch').addEventListener('input', function() {
    const show = SHOWS.find(s=>s.id===activeShowId);
    if (show) renderEpisodes(show, this.value);
  });

  /* ── AUTO-LOAD FIRST SHOW ── */
  if (SHOWS.length > 0) loadShow(SHOWS[0].id);
  </script>
</body>
</html>
